plugins {
    id 'com.android.application'
}

// The pack's version, one number for the launcher and the setup app (and version.json online): every commit of
// phone-kit and wallpaper-editor plus this launcher's own commits since the original project (origin/main..HEAD).
// It only goes up, so "install -r" always takes the newer build. Without git (or those folders) it stays 9 / 3.0.
def packVersion = {
    try {
        def count = { File dir, String range ->
            def p = ['git', '-C', dir.path, 'rev-list', '--count', range].execute()
            def out = p.text.trim()
            p.waitFor()
            if (p.exitValue() != 0) throw new GradleException('git ' + dir)
            out.toInteger()
        }
        File launcherRepo = rootDir.parentFile
        File workspace = launcherRepo.parentFile
        return count(launcherRepo, 'origin/main..HEAD') + count(new File(workspace, 'phone-kit'), 'HEAD') +
                count(new File(workspace, 'wallpaper-editor'), 'HEAD')
    } catch (Exception ignored) {
        return null
    }
}()

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode packVersion ?: 9
        versionName packVersion != null ? String.valueOf(packVersion) : '3.0'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // The quick panel's "Edit from the phone" QR code (PhoneEditor).
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
